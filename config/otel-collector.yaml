extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/sanitize:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: http.response.header.set_cookie, action: delete}
      - {key: url.query, action: delete}
      - {key: url.full, action: delete}
  batch:
    send_batch_size: 1024
    timeout: 2s

connectors:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    metrics_flush_interval: 5s
    metrics_expiration: 5m
    aggregation_cardinality_limit: 10000
    exemplars:
      enabled: true
  servicegraph:
    latency_histogram_buckets: [100ms, 250ms, 1s, 5s]

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    retry_on_failure: {enabled: true}
    sending_queue: {enabled: true, queue_size: 1024}
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    retry_on_failure: {enabled: true}
    sending_queue: {enabled: true, queue_size: 1024}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure: {enabled: true}
    sending_queue: {enabled: true, queue_size: 1024}

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlphttp/tempo, spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlphttp/loki]
