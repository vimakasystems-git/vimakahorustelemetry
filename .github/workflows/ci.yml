name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: horus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit
      - run: npm test
      - run: npm run test:otel
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/configure.mjs
      - run: docker compose config -q
      - run: docker compose run --rm --no-deps otel-collector validate --config=/etc/otelcol/config.yaml
      - run: docker compose run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose up -d --build
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
