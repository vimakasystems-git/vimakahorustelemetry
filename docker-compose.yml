# LOCAL DEVELOPMENT ONLY. All published ports are restricted to loopback.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [tempo, prometheus, loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver", "--storage.tsdb.retention.time=7d", "--enable-feature=exemplar-storage"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200"]

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/horus.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/horus.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]

  pyroscope:
    profiles: [profiling]
    image: grafana/pyroscope:1.14.0
    volumes: ["pyroscope-data:/data"]
    ports: ["127.0.0.1:4040:4040"]

  postgres:
    profiles: [metadata]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horus
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure.mjs}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    # No host port. Reserved for a future persistent control plane.

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run node scripts/configure.mjs}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]

  api:
    build: ./services/api
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      HORUS_API_TOKEN: ${HORUS_API_TOKEN:?Run node scripts/configure.mjs}
      HORUS_ENABLE_DEMO: ${HORUS_ENABLE_DEMO:-false}
      PROMETHEUS_URL: http://prometheus:9090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: horus-api
      HORUS_ENVIRONMENT: development
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [otel-collector]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  prometheus-data: {}
  tempo-data: {}
  loki-data: {}
  grafana-data: {}
  pyroscope-data: {}
  postgres-data: {}
